env_config:
  num_envs: 1
  env_spacing: 2.0
  decimation: 4
  episode_length_s: 10.0
  sim_dt: 0.005
  viewer_eye:
  - 4.5
  - 0.0
  - 6.0
  viewer_lookat:
  - 0.0
  - 0.0
  - 2.0
  render_results: false
  save_rendering_dir: models/0819/logs_rl/TRL_G1_Track/20260815_150022-manager/universal_token/all_modes/sonic_release_3pt_heading_thor_overheating_ankle_adaptivefix_wrist_81_from100k/renderings_training
  experiment_dir: !!python/object/apply:pathlib.PosixPath
  - models
  - 0819
  - logs_rl
  - TRL_G1_Track
  - 20260815_150022-manager
  - universal_token
  - all_modes
  - sonic_release_3pt_heading_thor_overheating_ankle_adaptivefix_wrist_81_from100k
  terrain_type: trimesh
  object_mass: null
  table_offset: null
  eval_camera_offset:
  - 2
  - 2
  - 1
  action_transform_module_cfg: null
  action_transform_module_checkpoint: null
  meta_action_dim: null
  needs_policy_atm: true
  obs:
    obs_dict: {}
    obs_dims:
      actor_obs: 930
      critic_obs: 1645
      tokenizer: 1761
    group_obs_dims:
      tokenizer:
        encoder_index:
        - 3
        command_multi_future_nonflat:
        - 10
        - 58
        command_z_multi_future_nonflat:
        - 10
        - 1
        command_z:
        - 1
        motion_anchor_ori_heading_mf_nonflat:
        - 10
        - 6
        motion_anchor_ori_heading:
        - 6
        command_multi_future_lower_body:
        - 240
        vr_3point_local_target:
        - 9
        vr_3point_local_orn_target:
        - 12
        smpl_joints_multi_future_local_nonflat:
        - 10
        - 72
        smpl_root_ori_heading_multi_future:
        - 10
        - 6
        joint_pos_multi_future_wrist_for_smpl:
        - 10
        - 6
    group_obs_names:
      tokenizer:
      - encoder_index
      - command_multi_future_nonflat
      - command_z_multi_future_nonflat
      - command_z
      - motion_anchor_ori_heading_mf_nonflat
      - motion_anchor_ori_heading
      - command_multi_future_lower_body
      - vr_3point_local_target
      - vr_3point_local_orn_target
      - smpl_joints_multi_future_local_nonflat
      - smpl_root_ori_heading_multi_future
      - joint_pos_multi_future_wrist_for_smpl
  action_clip_value: 20.0
  robot:
    type: g1_model_12_dex_thor
    algo_obs_dim_dict:
      actor_obs: 930
      critic_obs: 1645
      tokenizer: 1761
    actions_dim: 29
  rewards:
    num_critics: 1
  train_only_events:
  - push_robot
  - compliance_force_push
  headless: true
algo_config:
  critic:
    _target_: groot.rl.trl.modules.actor_critic_modules.Critic
    running_mean_std: true
    backbone:
      _target_: groot.rl.trl.modules.base_module.BaseModule
      process_output_dim: true
      module_config_dict:
        type: MLP
        input_dim:
        - critic_obs
        output_dim:
        - 1
        layer_config:
          type: MLP
          hidden_dims:
          - 4096
          - 4096
          - 2048
          - 2048
          - 1024
          - 1024
          - 512
          - 512
          activation: SiLU
  actor:
    backbone:
      quantizer:
        _target_: vector_quantize_pytorch.FSQ
      encoders:
        g1:
          inputs:
          - command_multi_future_nonflat
          - motion_anchor_ori_heading_mf_nonflat
          params:
            _target_: groot.rl.trl.modules.base_module.BaseModule
            input_dim: null
            output_dim: null
            num_input_temporal_dims: 10
            num_output_temporal_dims: 2
            module_config_dict:
              layer_config:
                type: MLP
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                activation: SiLU
        teleop:
          inputs:
          - command_multi_future_lower_body
          - vr_3point_local_target
          - vr_3point_local_orn_target
          - motion_anchor_ori_heading
          params:
            _target_: groot.rl.trl.modules.base_module.BaseModule
            input_dim: null
            output_dim: null
            num_input_temporal_dims: null
            num_output_temporal_dims: 2
            module_config_dict:
              layer_config:
                type: MLP
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                activation: SiLU
        smpl:
          inputs:
          - smpl_joints_multi_future_local_nonflat
          - smpl_root_ori_heading_multi_future
          - joint_pos_multi_future_wrist_for_smpl
          params:
            _target_: groot.rl.trl.modules.base_module.BaseModule
            input_dim: null
            output_dim: null
            num_input_temporal_dims: 10
            num_output_temporal_dims: 2
            module_config_dict:
              layer_config:
                type: MLP
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                activation: SiLU
      decoders:
        g1_dyn:
          inputs:
          - token_flattened
          - proprioception
          outputs:
          - action
          has_temporal_dim: false
          params:
            _target_: groot.rl.trl.modules.base_module.BaseModule
            input_dim: null
            output_dim: null
            num_input_temporal_dims: null
            num_output_temporal_dims: null
            module_config_dict:
              layer_config:
                type: MLP
                hidden_dims:
                - 4096
                - 4096
                - 2048
                - 2048
                - 1024
                - 1024
                - 512
                - 512
                activation: SiLU
        g1_kin:
          inputs:
          - token
          outputs:
          - command_multi_future_nonflat
          - motion_anchor_ori_heading_mf_nonflat
          has_temporal_dim: true
          params:
            _target_: groot.rl.trl.modules.base_module.BaseModule
            input_dim: null
            output_dim: null
            num_input_temporal_dims: 2
            num_output_temporal_dims: 10
            module_config_dict:
              layer_config:
                type: MLP
                hidden_dims:
                - 2048
                - 1024
                - 512
                - 512
                activation: SiLU
      _target_: groot.rl.trl.modules.universal_token_modules.UniversalTokenModule
      num_future_frames: 10
      proprioception_features:
      - actor_obs
      encoder_sample_probs:
        g1: 1.0
        teleop: 1.0
        smpl: 1.0
      num_fsq_levels: 32
      fsq_level_list: 32
      max_num_tokens: 2
      aux_loss_func:
        g1_recon:
          _target_: groot.rl.trl.losses.token_losses.G1ReconLoss
          loss_type: mse
        g1_smpl_latent:
          _target_: groot.rl.trl.losses.token_losses.G1SmplLatentLoss
          loss_type: mse
        g1_teleop_latent:
          _target_: groot.rl.trl.losses.token_losses.G1TeleopLatentLoss
          loss_type: mse
        teleop_smpl_latent:
          _target_: groot.rl.trl.losses.token_losses.TeleopSmplLatentLoss
          loss_type: mse
          detach_teleop_target: true
        reencoded_smpl_g1_latent:
          _target_: groot.rl.trl.losses.token_losses.ReencodedSmplG1LatentLoss
          loss_type: mse
      aux_loss_coef:
        g1_recon: 0.01
        g1_smpl_latent: 1.0
        g1_teleop_latent: 1.0
        teleop_smpl_latent: 1.0
        reencoded_smpl_g1_latent: 1.0
      reencode_smpl_g1_recon: true
    _target_: groot.rl.trl.modules.actor_critic_modules.Actor
    running_mean_std: false
    input_obs_dict: true
    has_aux_loss: true
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.01
  actor_learning_rate: 2.0e-05
  critic_learning_rate: 0.001
  max_grad_norm: 0.1
  use_clipped_value_loss: true
  schedule: adaptive
  desired_kl: 0.01
  adaptive_lr_min: 1.0e-05
  adaptive_lr_max: 0.0002
  use_new_actor_critic: true
  use_padding_mask: false
  ppo_shuffle_every_epoch: true
  sync_advantage_normalization: true
  empty_cache_every_n_ppo_epoch: -1
  num_steps_per_env: 24
  save_interval: 500
  eval_frequency: 500
  load_optimizer: true
  init_noise_std: 0.05
  num_learning_iterations: 100000
  init_at_random_ep_len: true
  eval_callbacks:
    analysis_plot_cb:
      _target_: groot.rl.agents.callbacks.analysis_plot_motion_tracking.AnalysisPlotMotionTracking
      config:
        sim_dt: 0.02
        log_single_robot: false
        plot_update_interval: 100
        compute_metrics: true
        use_weblogger: false
  global_rank: 0
  world_size: 128
  use_clampped_std: true
  std_clamp_min: 0.001
  std_clamp_max: 0.5
  eval:
    num_eval_episodes: 150
    save_videos: false
    video_save_prob: 1.0
    save_goal_reached_only: true
    save_trajectories: false
    num_save_episodes: 200
